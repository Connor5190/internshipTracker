<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Internship Tracker</title>
<style>
/* Editorial "briefing" treatment: Georgia for anything that carries a number
   or a name, Arial for everything functional, warm paper rather than white.
   Both faces are web-safe, so the page has no webfont to wait on. */
:root{
  --paper:#f4f0e7; --raised:#fbf9f3; --ink:#171713; --secondary:#5c5a52;
  --rule:#d8d2c5; --rule-soft:#e6e1d5; --cobalt:#1948d8; --cobalt-pale:#e8edff;
  --cobalt-ink:#fff; --amber:#f2a900; --amber-ink:#3a2900;
  --green:#355231; --green-bg:#edf2e8; --rust:#a9492f; --rust-bg:#f5ded5;
  --serif:Georgia,"Times New Roman",serif;
  --sans:Arial,Helvetica,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#14130f; --raised:#1c1a15; --ink:#ece7db; --secondary:#a09a8b;
    --rule:#34302a; --rule-soft:#26231e; --cobalt:#7d9cff; --cobalt-pale:#1e2a4d;
    --cobalt-ink:#0d1330; --amber:#f2a900; --amber-ink:#2a1e00;
    --green:#a8c79f; --green-bg:#22301f; --rust:#e0967f; --rust-bg:#3a221a;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 var(--sans)}
a{color:inherit;text-decoration:none}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px 80px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--secondary)}

/* ---------------------------------------------------------- masthead */
.mast{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;
  padding:22px 0 14px;border-bottom:1.5px solid var(--ink);flex-wrap:wrap}
.wordmark{font:400 27px/1 var(--serif);letter-spacing:-.01em;margin-top:5px}
.wordmark b{color:var(--cobalt);font-weight:400}
.checked{font-size:12.5px;color:var(--secondary);text-align:right}

/* ------------------------------------------------------------- hero */
.hero{display:flex;align-items:flex-start;gap:44px;padding:34px 0 30px;
  border-bottom:1.5px solid var(--ink);flex-wrap:wrap}
.brief{flex:1 1 420px;min-width:0;max-width:620px;margin:0 auto}
.brief .eyebrow{display:block;text-align:center;margin-bottom:12px}
.headline{font:400 clamp(32px,4.4vw,52px)/1.02 var(--serif);letter-spacing:-.02em;
  margin:0;overflow:hidden}
/* Floated, not stacked: the copy wraps down the right of the numeral the way
   a masthead figure does. Stacked, the two collide -- Georgia's glyphs run
   taller than the tight line-height the display size needs. */
.headline .big{float:left;font-size:clamp(62px,10vw,118px);line-height:.84;
  margin:0 16px 0 0}
.brief .note{font-size:13.5px;color:var(--secondary);text-align:center;
  margin:16px 0 0;clear:both}
.tiles{display:flex;flex:0 0 auto}
.tile{padding:2px 26px;border-left:1px solid var(--rule)}
.tile:first-child{border-left:0;padding-left:0}
.tile .lbl{font-size:12.5px;color:var(--secondary);line-height:1.3;max-width:110px}
.tile .num{font:400 46px/1.05 var(--serif);margin-top:8px}
.tile.hot .num{color:var(--rust)}

/* ---------------------------------------------------------- controls */
.controls{padding:20px 0 0}
.search{position:relative}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);
  width:17px;height:17px;stroke:var(--secondary);fill:none;stroke-width:2}
.search input{width:100%;padding:15px 16px 15px 45px;font:16px var(--sans);
  color:var(--ink);background:var(--raised);border:1px solid var(--rule);
  border-radius:3px;outline:none}
.search input:focus{border-color:var(--cobalt)}
.search input::placeholder{color:var(--secondary)}
.toolbar{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.sortbox{display:flex;align-items:center;gap:12px;padding:9px 14px;background:var(--raised);
  border:1px solid var(--rule);border-radius:3px}
.sortbox select{font:700 13px var(--sans);color:var(--ink);background:none;border:0;
  outline:none;cursor:pointer}
.toggle{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--raised);
  border:1px solid var(--rule);border-radius:3px;font-size:13px;cursor:pointer;
  user-select:none}
.toggle input{width:15px;height:15px;margin:0;accent-color:var(--cobalt);cursor:pointer}
.showing{margin-left:auto;background:var(--amber);color:var(--amber-ink);
  font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  padding:8px 13px;border-radius:2px}

/* ------------------------------------------------------------ table */
.thead,.row{display:grid;grid-template-columns:62px minmax(0,1fr) 190px 150px 172px;
  gap:16px;align-items:center}
.thead{padding:22px 0 7px;border-bottom:1px solid var(--ink);
  font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--secondary)}
.divider{margin:0;padding:26px 0 7px;border-bottom:1px solid var(--ink);
  font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.row{padding:15px 0;border-bottom:1px solid var(--rule-soft)}
.rank{font:400 30px/1 var(--serif);color:var(--ink);letter-spacing:-.03em}
.co{font:400 23px/1.12 var(--serif);letter-spacing:-.01em;overflow-wrap:anywhere}
.title{font-size:13.5px;line-height:1.35;color:var(--secondary);margin-top:2px;
  overflow-wrap:anywhere}
.title:hover{color:var(--cobalt);text-decoration:underline}
.loc,.status{font-size:13px;color:var(--secondary);line-height:1.35;overflow-wrap:anywhere}
/* A placeholder keeps the desktop columns aligned; on mobile the row stacks,
   so an em dash on a line of its own is just noise (hidden below). */
.loc:empty::before{content:"—";color:var(--rule)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;
  vertical-align:1px}
.d0{background:var(--rust)} .d1{background:var(--amber)}
.d2{background:#c9a227} .d3{background:var(--rule)} .d4{background:var(--rule)}
.acts{display:flex;align-items:center;justify-content:flex-end;gap:12px}
.mark{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--secondary);
  cursor:pointer;user-select:none;white-space:nowrap}
.mark input{width:17px;height:17px;margin:0;accent-color:var(--cobalt);cursor:pointer}
.apply{background:var(--cobalt);color:var(--cobalt-ink);font-size:12.5px;font-weight:700;
  padding:9px 14px;border-radius:2px;white-space:nowrap}
.apply:hover{opacity:.88}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;
  padding:2px 7px;border-radius:2px;background:var(--green-bg);color:var(--green);
  margin-top:6px}
.row.done .co,.row.done .title{color:var(--secondary)}
.row.done .co{font-style:italic}
.gone{background:var(--rust-bg);color:var(--rust)}
.empty{padding:26px 0;font-size:14px;color:var(--secondary)}

/* --------------------------------------------------------- messages */
.banner{margin:18px 0 0;padding:13px 16px;border-left:3px solid var(--amber);
  background:var(--raised);font-size:13px;line-height:1.5;color:var(--secondary)}
.banner b{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:20;
  background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:2px;
  font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
footer{margin-top:44px;padding-top:18px;border-top:1.5px solid var(--ink);
  font-size:12px;line-height:1.7;color:var(--secondary)}
footer b{color:var(--ink)}
footer a{color:var(--cobalt)}
footer a:hover{text-decoration:underline}
.err{margin:2px 0}

@media (max-width:860px){
  .wrap{padding:0 16px 64px}
  .hero{gap:26px;padding:26px 0 24px}
  .tiles{width:100%}
  .tile{flex:1;padding:2px 16px}
  .tile .num{font-size:36px}
  .headline{text-align:center}
  .headline .big{float:none;display:block;margin:0 0 2px}
  .thead{display:none}
  .row{grid-template-columns:44px minmax(0,1fr);gap:4px 12px;padding:16px 0}
  .rank{font-size:24px;align-self:start;padding-top:3px}
  /* Each of these is a grid *child*, so the rule has to name the wrapper --
     .status is the span inside .st and would leave its parent auto-placed
     back into the 44px rank column. */
  .role,.loc,.st{grid-column:2}
  .loc,.status{font-size:12.5px}
  .loc:empty{display:none}
  .checked{text-align:left}
  .acts{grid-column:2;justify-content:flex-start;margin-top:9px}
  .co{font-size:20px}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="mast">
    <div>
      <span class="eyebrow">Personal internship desk</span>
      <div class="wordmark">Internship Tracker <b>2027</b></div>
    </div>
    <div class="checked" id="checked">Loading…</div>
  </div>

  <div class="hero">
    <div class="brief">
      <span class="eyebrow" id="briefday">Today's briefing</span>
      <h1 class="headline" id="headline"><span class="big">—</span></h1>
      <p class="note">Across every board this scanner watches · based on when
        each role was first seen</p>
    </div>
    <div class="tiles" id="tiles"></div>
  </div>

  <div id="banner"></div>

  <div class="controls">
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" type="search" placeholder="Search by company, role, or location"
             autocomplete="off" spellcheck="false">
    </div>
    <div class="toolbar">
      <div class="sortbox">
        <span class="eyebrow">Sort</span>
        <select id="sort">
          <option value="new">Newest first</option>
          <option value="co">Company A–Z</option>
        </select>
      </div>
      <label class="toggle"><input type="checkbox" id="hide"> Hide applied</label>
      <span class="showing" id="showing">—</span>
    </div>
  </div>

  <main id="app"></main>
  <footer id="foot"></footer>
</div>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script>
"use strict";

/* ------------------------------------------------------------------ store
 * Applied state is shared, unauthenticated, and lives in a Firebase
 * Realtime Database reached over its plain REST API -- no SDK, so there is
 * no bundle to version-pin and the only configuration is one URL. Live
 * updates come from RTDB's own EventSource stream, so a box ticked on a
 * phone lands on a laptop that already has the page open.
 *
 * With no URL configured the same interface is backed by localStorage, so
 * the page is never broken -- just not shared, which the banner says out loud.
 */
var Store = (function () {
  var raw = (window.TRACKER_CONFIG && window.TRACKER_CONFIG.databaseURL || "").trim();
  var db = raw.replace(/\/+$/, "");
  var ok = /^https:\/\/[\w.-]+\.(firebaseio\.com|firebasedatabase\.app)$/.test(db);
  var KEY = "internship-tracker-applied";

  function localRead() {
    try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; }
  }
  function localWrite(state) {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  if (!ok) {
    return {
      configured: false,
      load: function () { return Promise.resolve(localRead()); },
      set: function (id, entry) { var s = localRead(); s[id] = entry; localWrite(s); return Promise.resolve(); },
      remove: function (id) { var s = localRead(); delete s[id]; localWrite(s); return Promise.resolve(); },
      subscribe: function (cb) {
        // Keeps two tabs in the same browser honest, at least.
        window.addEventListener("storage", function (e) {
          if (e.key === KEY) cb(localRead());
        });
      }
    };
  }

  var url = function (path) { return db + "/applied" + path + ".json"; };

  function load() {
    return fetch(url(""), { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (d) { return d || {}; });
  }

  function poll(cb) {
    setInterval(function () { load().then(cb).catch(function () {}); }, 60000);
  }

  function subscribe(cb) {
    var connected = false, es;
    try { es = new EventSource(url("")); } catch (e) { return poll(cb); }

    function handle(isPatch) {
      return function (ev) {
        var msg;
        try { msg = JSON.parse(ev.data); } catch (e) { return; }
        if (!msg) return;
        connected = true;
        var path = msg.path || "/";
        var data = msg.data;
        if (path === "/") {
          if (isPatch) cb(null, data || {});      // merge
          else cb(data || {});                    // replace
          return;
        }
        var seg = path.replace(/^\//, "").split("/");
        if (seg.length !== 1) { load().then(cb).catch(function () {}); return; }
        var patch = {}; patch[seg[0]] = data;     // null data deletes
        cb(null, patch);
      };
    }
    es.addEventListener("put", handle(false));
    es.addEventListener("patch", handle(true));
    es.addEventListener("cancel", function () { es.close(); poll(cb); });
    es.addEventListener("auth_revoked", function () { es.close(); poll(cb); });
    es.onerror = function () {
      // EventSource retries on its own once it has connected; a stream that
      // never connected at all (bad URL, rules denying read) never will.
      if (!connected) { es.close(); poll(cb); }
    };
  }

  return {
    configured: true,
    load: load,
    subscribe: subscribe,
    set: function (id, entry) {
      return fetch(url("/" + id), {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(entry)
      }).then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); });
    },
    remove: function (id) {
      return fetch(url("/" + id), { method: "DELETE" })
        .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); });
    }
  };
})();

/* ------------------------------------------------------------------ state */
var data = null;          // roles.json
var applied = {};         // id -> {at, company, title, url}
var query = "";
var sortBy = "new";
var hideApplied = false;

var $ = function (id) { return document.getElementById(id); };

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

/* Ages are recomputed here rather than baked in at build time: the page can
 * sit open for days, and a tab left running since Monday shouldn't still be
 * calling Monday's postings "opened today". */
function daysSince(iso) {
  if (!iso) return null;
  var p = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);
  if (!p) return null;
  var then = new Date(+p[1], +p[2] - 1, +p[3]);
  var now = new Date(); now.setHours(0, 0, 0, 0);
  var d = Math.round((now - then) / 86400000);
  return d < 0 ? 0 : d;   // ledger rows written pre-timezone-fix can sit ahead
}
function ageKey(r) { var d = daysSince(r.first_seen); return d === null ? 1e9 : d; }

/* "~" marks a first-seen date rather than a real posting date, so an
 * estimate never reads as fact. */
function status(role) {
  var d = daysSince(role.first_seen);
  if (d === null) return '<span class="status">Not dated</span>';
  var t = d === 0 ? "Opened today" : d === 1 ? "Opened 1d ago"
        : d < 14 ? "Opened " + d + "d ago"
        : d < 60 ? "Opened " + Math.floor(d / 7) + "w ago"
        : "Opened " + Math.floor(d / 30) + "mo ago";
  if (!role.exact) t = t.replace("Opened ", "Seen ~");
  var cls = d <= 0 ? "d0" : d <= 2 ? "d1" : d <= 6 ? "d2" : d <= 13 ? "d3" : "d4";
  return '<span class="status"><i class="dot ' + cls + '"></i>' + esc(t) + "</span>";
}

function matches(role) {
  if (!query) return true;
  return (role.company + " " + role.title + " " + (role.location || ""))
    .toLowerCase().indexOf(query) !== -1;
}

function bucketOf(role) {
  var d = daysSince(role.first_seen);
  if (d === 0) return "Opened today";
  if (d !== null && d < 7) return "Earlier this week";
  return "Still open";
}

/* ------------------------------------------------------------------ render */
function whenApplied(ts) {
  var d = Math.round((Date.now() - ts) / 86400000);
  if (d <= 0) return "today";
  if (d === 1) return "yesterday";
  if (d < 30) return d + "d ago";
  return new Date(ts).toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

/* A ticked role is rendered twice: it stays put in the main table, ticked,
 * so you don't lose your place in a list you're working down -- and it gets
 * a copy in Applied at the bottom. Both copies carry a checkbox, and both
 * write the same `applied[id]`, so unticking either one clears the pair.
 *
 * `copy` says which of the two this is: the Applied one shows when you
 * applied rather than how old the posting is. */
function rowHTML(role, n, checked, copy) {
  var right = copy
    ? '<span class="status">Applied ' + esc(whenApplied(role.at || Date.now())) + "</span>"
    : status(role);
  var tag = copy && !role.live
    ? '<span class="tag gone">No longer listed</span>' : "";
  return '<div class="row' + (checked ? " done" : "") + '">' +
    '<div class="rank">#' + n + "</div>" +
    '<div class="role">' +
      '<div class="co">' + esc(role.company) + "</div>" +
      '<a class="title" href="' + esc(role.url) + '" target="_blank" rel="noopener">' +
        esc(role.title) + "</a>" + tag +
    "</div>" +
    '<div class="loc">' + esc(role.location) + "</div>" +
    '<div class="st">' + right + "</div>" +
    '<div class="acts">' +
      '<label class="mark"><input type="checkbox" data-id="' + esc(role.id) + '"' +
        (checked ? " checked" : "") + ' aria-label="Applied to ' + esc(role.title) +
        ' at ' + esc(role.company) + '"> Applied</label>' +
      '<a class="apply" href="' + esc(role.url) + '" target="_blank" rel="noopener">' +
        "Apply &rarr;</a>" +
    "</div></div>";
}

function render() {
  if (!data) return;

  var shown = [], left = 0, todayLeft = 0, weekLeft = 0;
  data.roles.forEach(function (r) {
    // The tiles count what's still to do, so they ignore both the search box
    // and anything already ticked.
    if (!applied[r.id]) {
      left++;
      var n = daysSince(r.first_seen);
      if (n === 0) todayLeft++;
      else if (n !== null && n < 7) weekLeft++;
    }
    if (hideApplied && applied[r.id]) return;
    if (matches(r)) shown.push(r);
  });

  if (sortBy === "co") {
    shown.sort(function (a, b) {
      var c = a.company.toLowerCase() < b.company.toLowerCase() ? -1
            : a.company.toLowerCase() > b.company.toLowerCase() ? 1 : 0;
      return c || ageKey(a) - ageKey(b);
    });
  } else {
    shown.sort(function (a, b) {
      return ageKey(a) - ageKey(b) ||
        (a.company.toLowerCase() < b.company.toLowerCase() ? -1 : 1);
    });
  }

  // An applied role is rendered from the *stored* copy, not the scan, so a
  // posting that has since come down still shows up as something you applied
  // to rather than silently vanishing from your own history.
  var byId = {};
  data.roles.forEach(function (r) { byId[r.id] = r; });
  var done = Object.keys(applied).map(function (id) {
    var e = applied[id] || {}, live = byId[id];
    return {
      id: id, at: e.at || 0, live: !!live,
      company: e.company || (live && live.company) || "—",
      title: e.title || (live && live.title) || "(role)",
      url: e.url || (live && live.url) || "#",
      location: live ? live.location : "",
      first_seen: live ? live.first_seen : "", exact: live ? live.exact : false
    };
  }).filter(matches).sort(function (a, b) { return b.at - a.at; });

  // ---- hero
  var week = todayLeft + weekLeft;
  $("headline").innerHTML = '<span class="big">' + week + "</span> " +
    (week === 1 ? "role opened in the last 7 days." : "roles opened in the last 7 days.");
  $("tiles").innerHTML = [
    ["Opened today", todayLeft, todayLeft > 0],
    ["Left to apply", left, false],
    ["Applied", Object.keys(applied).length, false]
  ].map(function (t) {
    return '<div class="tile' + (t[2] ? " hot" : "") + '">' +
      '<div class="lbl">' + t[0] + '</div><div class="num">' + t[1] + "</div></div>";
  }).join("");
  $("showing").textContent = shown.length + " of " + data.roles.length + " showing";

  // ---- table
  var h = ['<div class="thead"><div>No.</div><div>Role</div><div>Location</div>' +
           '<div>Status</div><div></div></div>'];
  if (!shown.length) {
    h.push('<div class="empty">' + (query
      ? "Nothing matches “" + esc(query) + "”."
      : "No roles to show.") + "</div>");
  }
  var bucket = null;
  shown.forEach(function (r, i) {
    // Only meaningful while sorted by date -- alphabetical order would
    // interleave the buckets into noise.
    if (sortBy === "new") {
      var b = bucketOf(r);
      if (b !== bucket) { bucket = b; h.push('<div class="divider">' + b + "</div>"); }
    }
    h.push(rowHTML(r, i + 1, !!applied[r.id], false));
  });

  if (done.length) {
    h.push('<div class="divider">Applied &middot; ' + done.length + "</div>");
    done.forEach(function (r, i) { h.push(rowHTML(r, i + 1, true, true)); });
  }
  $("app").innerHTML = h.join("");
}

function toast(msg) {
  var t = $("toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(toast._t);
  toast._t = setTimeout(function () { t.classList.remove("on"); }, 2600);
}

/* ------------------------------------------------------------------ events */
document.addEventListener("change", function (ev) {
  var box = ev.target;
  if (!box.matches || !box.matches('input[type=checkbox][data-id]')) return;
  var id = box.getAttribute("data-id");
  var role = null;
  data.roles.forEach(function (r) { if (r.id === id) role = r; });

  if (applied[id]) {
    var prev = applied[id];
    delete applied[id];
    render();
    Store.remove(id).catch(function () {
      applied[id] = prev; render(); toast("Couldn't save — check your connection");
    });
  } else {
    var entry = {
      at: Date.now(),
      company: role ? role.company : "",
      title: role ? role.title : "",
      url: role ? role.url : ""
    };
    applied[id] = entry;
    render();
    Store.set(id, entry).catch(function () {
      delete applied[id]; render(); toast("Couldn't save — check your connection");
    });
  }
});

$("q").addEventListener("input", function (e) {
  query = e.target.value.trim().toLowerCase();
  render();
});
$("sort").addEventListener("change", function (e) { sortBy = e.target.value; render(); });
$("hide").addEventListener("change", function (e) { hideApplied = e.target.checked; render(); });

// "/" focuses search, the way the reference board does.
document.addEventListener("keydown", function (e) {
  if (e.key === "/" && document.activeElement !== $("q")) { e.preventDefault(); $("q").focus(); }
});

/* ------------------------------------------------------------------- boot */
function banner() {
  if (Store.configured) return;
  $("banner").innerHTML = '<div class="banner"><b>This browser only.</b> ' +
    "Applied ticks aren't shared yet — they're saved locally and won't follow " +
    "you to another device. Add your Firebase Realtime Database URL to " +
    "<b>site/config.js</b> to turn on sync.</div>";
}

function footer() {
  var f = [];
  if (data.manual && data.manual.length) {
    f.push("<b>Check by hand · " + data.manual.length + "</b><br>" +
      "No structured job list on these sites, so their page text is all the " +
      "scanner can see:<br>" +
      data.manual.map(function (m) {
        return '<a href="' + esc(m.url) + '" target="_blank" rel="noopener">' +
          esc(m.company) + "</a>";
      }).join(" &nbsp;·&nbsp; ") + "<br><br>");
  }
  var hid = [];
  if (data.hidden && data.hidden.old) hid.push(data.hidden.old + " older than 3 months");
  if (data.hidden && data.hidden.india) hid.push(data.hidden.india + " listed only in India");
  if (hid.length) f.push("Hidden: " + hid.join(", ") + ".<br><br>");
  f.push("Dates are the employer's posting date where the job board exposes one. " +
    "<b>Seen ~</b> means that board doesn't, so the date shown is when this " +
    "scanner first saw the role — it may be older.");
  if (data.errors && data.errors.length) {
    f.push("<br><br><b>" + data.errors.length + " couldn't be scanned</b>");
    data.errors.forEach(function (e) {
      var r = e.error.length > 110 ? e.error.slice(0, 108).trim() + "…" : e.error;
      f.push('<div class="err">' + esc(e.company) + " — " + esc(r) + "</div>");
    });
  }
  if (data.blocked && data.blocked.length) {
    f.push("<br><br><b>" + data.blocked.length + " block scrapers</b> (expected, " +
      "check by hand): " + esc(data.blocked.join(", ")));
  }
  $("foot").innerHTML = f.join("");
}

banner();

fetch("roles.json", { cache: "no-store" })
  .then(function (r) {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  })
  .then(function (d) {
    data = d;
    var when = new Date(d.generated_at);
    $("briefday").textContent =
      when.toLocaleDateString(undefined, { weekday: "long" }) + "'s briefing";
    $("checked").innerHTML = "Roles checked at " +
      when.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }) +
      "<br>" + d.companies_matched + " of " + d.companies_scanned +
      " companies have matches";
    footer();
    render();
    return Store.load();
  })
  .then(function (state) {
    applied = state || {};
    render();
    Store.subscribe(function (replace, merge) {
      if (merge) {
        Object.keys(merge).forEach(function (k) {
          if (merge[k] === null) delete applied[k]; else applied[k] = merge[k];
        });
      } else {
        applied = replace || {};
      }
      render();
    });
  })
  .catch(function (e) {
    if (!data) {
      $("checked").textContent = "Couldn't load the latest scan.";
      $("app").innerHTML = '<div class="empty">No <b>roles.json</b> yet — it\'s ' +
        "written by the twice-daily scan. Run the <b>Update Applied Board</b> " +
        "workflow from the Actions tab to publish one.</div>";
    } else {
      toast("Couldn't load applied state");
    }
  });
</script>
</body>
</html>

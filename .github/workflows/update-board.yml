name: Update Applied Board

# Twice a day, so the board is never more than ~12 hours stale -- once in the
# morning (just before the 7am slot daily-recap.yml uses when it's scheduled)
# and once in the evening to pick up the day's later postings.
#
# Both workflows commit the same ledger, so the commit step retries on a push
# race regardless of timing.
on:
  schedule:
    - cron: "30 10,22 * * *"  # 6:30 AM / 6:30 PM America/New_York (EDT, UTC-4)
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

# Pages rejects concurrent deployments; the evening run and a manual one
# kicked off alongside it would otherwise fail at the last step.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  board:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/scan

      # Ahead of the deploy: the ledger is the one piece of state that can't
      # be reconstructed after the fact, so a flaky deploy must not be able to
      # cost a run's first-seen dates.
      - name: Commit updated ledger
        run: scripts/commit_ledger.sh

      - name: Build applied board
        run: python3 scripts/build_site.py scan_result_enriched.json site/roles.json

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy applied board
        id: deployment
        uses: actions/deploy-pages@v5

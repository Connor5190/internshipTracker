name: Daily Internship Recap

on:
  schedule:
    - cron: "0 11 * * *"  # 7:00 AM America/New_York (EDT, UTC-4)
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

# Pages rejects concurrent deployments; a manual run kicked off while the
# 7am one is still going would otherwise fail at the last step.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  recap:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scan companies
        run: python3 internship_tracker.py companies.txt --term "summer 2027" --json --workers 8 > scan_result.json

      - name: Update seen-postings ledger
        run: python3 scripts/update_ledger.py scan_result.json .state/seen_postings.json .state/companies_seen.json scan_result_enriched.json

      - name: Build recap
        id: recap
        run: |
          python3 scripts/format_recap.py scan_result_enriched.json > recap.html
          {
            echo "subject<<EOF"
            python3 scripts/format_recap.py scan_result_enriched.json --subject
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Email recap
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.mail.me.com
          server_port: 587
          username: ${{ secrets.ICLOUD_EMAIL }}
          password: ${{ secrets.ICLOUD_APP_PASSWORD }}
          subject: ${{ steps.recap.outputs.subject }}
          to: ${{ secrets.ICLOUD_EMAIL }},chill5@friars.providence.edu
          from: ${{ secrets.ICLOUD_EMAIL }}
          html_body: file://recap.html

      # Ahead of the Pages deploy: the ledger is the one piece of state that
      # can't be reconstructed after the fact, so a flaky deploy must not be
      # able to cost us a day of first-seen dates.
      - name: Commit updated ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .state/seen_postings.json .state/companies_seen.json
          git diff --staged --quiet || git commit -m "Update seen-postings ledger [skip ci]"
          git push

      - name: Build applied board
        run: python3 scripts/build_site.py scan_result_enriched.json site/roles.json

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy applied board
        id: deployment
        uses: actions/deploy-pages@v5

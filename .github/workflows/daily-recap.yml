name: Daily Internship Recap

on:
  schedule:
    - cron: "0 11 * * *"  # 7:00 AM America/New_York (EDT, UTC-4)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  recap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scan companies
        run: python3 internship_tracker.py companies.txt --term "summer 2027" --json --workers 8 > scan_result.json

      - name: Update seen-postings ledger
        run: python3 scripts/update_ledger.py scan_result.json .state/seen_postings.json .state/companies_seen.json scan_result_enriched.json

      - name: Build recap
        id: recap
        run: |
          python3 scripts/format_recap.py scan_result_enriched.json > recap.html
          {
            echo "subject<<EOF"
            python3 scripts/format_recap.py scan_result_enriched.json --subject
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Email recap
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.mail.me.com
          server_port: 587
          username: ${{ secrets.ICLOUD_EMAIL }}
          password: ${{ secrets.ICLOUD_APP_PASSWORD }}
          subject: ${{ steps.recap.outputs.subject }}
          to: ${{ secrets.ICLOUD_EMAIL }},chill5@friars.providence.edu
          from: ${{ secrets.ICLOUD_EMAIL }}
          html_body: file://recap.html

      - name: Commit updated ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .state/seen_postings.json .state/companies_seen.json
          if git diff --staged --quiet; then
            echo "Ledger unchanged."
            exit 0
          fi
          git commit -m "Update seen-postings ledger [skip ci]"
          # update-board.yml writes this same ledger, so a push can lose a
          # race with it. Rebase and retry rather than dropping the run's
          # first-seen dates, which can't be reconstructed after the fact.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push lost a race — rebasing (attempt $attempt)…"
            git pull --rebase
          done
          git push
